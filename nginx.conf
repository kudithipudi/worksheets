# ── Texas Worksheet Generator – Nginx server block ───────────────────────────
# Drop this inside an http {} context, or include it from /etc/nginx/sites-enabled/
#
# Designed for use behind Cloudflare (set CF SSL/TLS mode to "Full" or "Full (strict)")
# Real visitor IPs are restored from the CF-Connecting-IP header.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # ── Cloudflare real-IP restoration ────────────────────────────────────────
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-Frame-Options          "SAMEORIGIN"    always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Static files (cache aggressively) ────────────────────────────────────
    location /static/ {
        alias /var/www/worksheets/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── API + SPA – proxy to Gunicorn Unix socket ──────────────────────────
    location / {
        proxy_pass         http://unix:/tmp/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Match the 120-second Gunicorn timeout (LLM calls can be slow)
        proxy_read_timeout    125s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    125s;

        proxy_buffering    off;
        client_max_body_size 1m;
    }
}
